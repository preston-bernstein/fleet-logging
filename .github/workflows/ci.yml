name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the writing gate diffs against main
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.8"
          enable-cache: false
      - name: Install the pinned gate tools
        run: bash scripts/install-gate-tools.sh
      - name: Core gate
        run: bash scripts/core-validate.sh
      - name: Workflow gate
        run: bash scripts/gha-validate.sh
      - name: Python gate
        run: bash scripts/py-validate.sh
      - name: Writing gate
        run: bash scripts/writing-validate.sh
