[project]
name = "fleet-logging"
version = "0.1.0"
description = "Shared implementation of home-infra CONVENTIONS.md §18's fleet JSON logging contract, plus a yaml+env config loader — imported by home-lab repos instead of each hand-rolling it."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "python-dotenv>=1"]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["ruff==0.16.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_logging"]

[tool.pytest.ini_options]
norecursedirs = [".git", ".venv", "dist", "*.egg-info"]

[tool.ruff]
line-length = 100
target-version = "py311"
