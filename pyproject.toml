[project]
name = "fleet-logging"
version = "0.1.0"
description = "Shared JSON structured-logging format plus a yaml+env config loader for a personal home lab's internal services — imported instead of each hand-rolling it."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "python-dotenv>=1"]

[project.optional-dependencies]
# The shared CI installs these extras (pip install -e ".[...]"). Keep them next to the dependency group.
test = ["pytest>=8"]
dev = ["ruff==0.16.1"]

[dependency-groups]
dev = ["mypy==2.4.1", "pytest==9.2.0", "ruff==0.16.1", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_logging"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
norecursedirs = [".git", ".venv", "dist", "*.egg-info"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored gate scripts from the stack packs. They stay byte-identical to the pack copies.
extend-exclude = ["scripts/*.py"]

[tool.ruff.lint]
# Pinned on purpose: ruff's default set has changed between releases. The ignore list stays empty,
# so every exception is a decision in a code comment (# noqa: CODE -- reason), not in config.
select = [
  "E", "F", "I", "N", "UP",
  "S", "B", "BLE",
  "ASYNC",
  "ANN",
  "T20",
  "G",
  "PGH", "RUF",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests assert and need no annotations. This is per path, not global.
"tests/**" = ["S101", "ANN"]

[tool.mypy]
strict = true
files = ["src"]
